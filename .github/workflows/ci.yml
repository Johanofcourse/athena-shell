name: CI

# Deliberately does NOT run the DeepSeek-backed eval suite (backend/evals/)
# - that costs real API money per run and is run manually, ~twice a week,
# instead (see docs/PRODUCT_REVIEW.md and the eval-suite-cadence note).
# Everything here is free: no external API calls, no live keys needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npx tsc -b
